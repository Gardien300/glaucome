# Config phased fine-tuning progressif (Bloc D).
# Phase 0: head only (5 ep) -> Phase 1: dernier bloc (10 ep) -> Phase 2: tout (25 ep)

model:
  backbone: efficientnet_v2_m
  pretrained: true
  freeze_backbone: false

data:
  image_size: 384

train:
  batch_size: 64
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  lr: 3.0e-4
  weight_decay: 1.0e-4
  pos_weight: "auto"
  patience: 15
  save_interval_epochs: 5
  grad_clip_norm: 1.0
  augmentation_level: strong
  label_smoothing: 0.05
  loss: bce
  amp: true
  compile: true
  phase_epochs: [5, 10, 25]
  scheduler:
    type: cosine
    T_max: 40
    eta_min: 1.0e-6

calibration:
  enabled: true
